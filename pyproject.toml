[project]
name = "python"
version = "1.0.3"
description = "My portfolio website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "frozen-flask>=1.0.2",
    "mypy>=2.3.1",
    "ruff>=0.14.10",
]

[tool.ruff]
indent-width = 4
line-length = 79

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["I"]
